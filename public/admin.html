<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Chris Hair Cut</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <h1>Admin Access Required</h1>
      <p style="font-size:13px;color:#6b6560;margin-bottom:1.5rem;line-height:1.6;">
        Please sign in from the main site using the Sign In button in the top nav. If your account has admin access, you'll be brought here automatically.
      </p>
      <a href="/" class="back-to-site" style="margin-top:0;">← Back to site to sign in</a>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1 id="dashTitle">Bookings</h1>
      <div class="dash-actions">
        <a href="/" class="view-site-btn">View Site</a>
        <button class="logout-btn" onclick="logout()">Log Out</button>
      </div>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" id="adminTabBookings" onclick="switchAdminTab('bookings')">Bookings</div>
      <div class="admin-tab" id="adminTabReviews" onclick="switchAdminTab('reviews')">Reviews</div>
    </div>

    <div id="tableWrap"></div>
    <div id="reviewsWrap" style="display:none;"></div>
  </div>

  <script src="escape.js"></script>
  <script src="admin.js"></script>
</body>
</html>
