<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Chris Hair Cut</title>
  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <h1>Admin Access Required</h1>
      <p class="admin-login-note">
        Please sign in from the main site using the Sign In button in the top nav. If your account has admin access, you'll be brought here automatically.
      </p>
      <a href="/" class="back-to-site back-to-site-flush">← Back to site to sign in</a>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1 id="dashTitle">Bookings</h1>
      <div class="dash-actions">
        <a href="/" class="view-site-btn">View Site</a>
        <button class="logout-btn" data-action="admin-logout">Log Out</button>
      </div>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" id="adminTabBookings" data-action="switch-admin-tab" data-arg="bookings">Bookings</div>
      <div class="admin-tab" id="adminTabReviews" data-action="switch-admin-tab" data-arg="reviews">Reviews</div>
    </div>

    <div id="tableWrap"></div>
    <div id="reviewsWrap" class="hidden"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
